<!doctype html>
<!--
  Template for src/assets/social-card.png, the default link preview (1200 × 630).
  Render it after changing the site's look or the role line:

    "/Applications/Brave Browser.app/Contents/MacOS/Brave Browser" --headless \
      --allow-file-access-from-files --hide-scrollbars --force-device-scale-factor=1 \
      --window-size=1200,630 --screenshot=src/assets/social-card.png \
      "file://$PWD/scripts/social-card.html"

  Any Chromium-based browser works the same way.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
    @font-face { font-family: "IBM Plex Sans"; src: url("../public/fonts/plex-sans.woff2") format("woff2"); font-weight: 400 600; }
    @font-face { font-family: "IBM Plex Serif"; src: url("../public/fonts/plex-serif.woff2") format("woff2"); font-weight: 400; }

    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body {
        background: #f8f5ee;
        color: #24221e;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 64px;
    }
    img { width: 220px; height: 220px; border-radius: 50%; object-fit: cover; }
    h1 {
        margin: 0 0 18px;
        font: 600 84px/1 "IBM Plex Sans";
        letter-spacing: -0.02em;
        color: #161512;
    }
    p { margin: 0; }
    .role { font: 400 34px/1.3 "IBM Plex Serif"; color: #5c574e; }
    .site { margin-top: 30px; font: 600 26px/1 "IBM Plex Sans"; color: #2443ab; }
</style>
</head>
<body>
    <img src="../src/assets/avatar.webp" alt="">
    <div>
        <h1>Patrick Scheid</h1>
        <p class="role">Engineering manager at STACKIT</p>
        <p class="site">patrickscheid.de</p>
    </div>
</body>
</html>
