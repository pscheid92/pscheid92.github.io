# patrickscheid.de as static files, answering the way GitHub Pages did, so
# every address that worked there works here: /about goes to /about/, a
# missing page gets the site's 404 page, and everything is public to read.
# TLS, the redirects from http and www, and HSTS are the gateway's business
# (pscheid92/k8s, apps/website).
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /srv/www;
    server_tokens off;

    # Nothing about visitors is logged: no addresses, no user agents, no
    # requests. An ordinary error line quotes the request as well, so only
    # failures of nginx itself are written.
    access_log off;
    log_not_found off;
    error_log /dev/stderr crit;

    # /about is a directory, and nginx redirects it to /about/. As a path
    # only: nginx knows neither the public scheme nor the public port.
    absolute_redirect off;

    charset utf-8;
    charset_types text/css text/plain application/javascript application/json;

    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_types text/css text/plain application/javascript application/json application/xml image/svg+xml image/x-icon;

    # A missing page gets the site's own 404 page. So does a directory
    # without an index page (/blog/2026/), where nginx would say 403.
    error_page 404 /404.html;
    error_page 403 =404 /404.html;

    # Pages, the feed, keys.txt and the retired service worker (cpr-sw.js)
    # are checked against the server on every load, so a deploy reaches
    # everyone at once. Any site may read them, as on GitHub Pages: all of it
    # is public, and nobody is logged in here.
    # nginx drops these two in a location that adds a header of its own, so
    # those locations repeat what they need.
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;

    # Build output carries a content hash in its name: cache it for good.
    # Not for a missing one, though: while a deploy rolls out, a page from
    # the new version can ask the old one for a file it doesn't have yet.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # The fonts keep their names when scripts/build-fonts.py rebuilds them
    # with more characters, so a week, not for good.
    location /fonts/ {
        add_header Cache-Control "public, max-age=604800";
        add_header Access-Control-Allow-Origin "*";
    }

    # /cw/2027/42, /cw/this/26: every address below /cw/ is the calendar
    # week page, which reads year and week from the address.
    location /cw/ {
        try_files /cw/index.html =404;
    }

    # The feed and the sitemaps are application/xml, as they were on GitHub
    # Pages; nginx's own table says text/xml.
    location ~ ^/[^/]+\.xml$ {
        types { }
        default_type application/xml;
    }

    # The speech-token service has its own route at the gateway. A call that
    # ends up here anyway gets JSON, never the 404 page.
    location /api/ {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 404 '{"error":"not found"}';
    }

    # For the orchestrator's probes.
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
}
