name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# One run at a time, in the order of the pushes: the image tags carry the
# time of their build, and the cluster deploys whichever tag is newest.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check

  # The site and its speech-token service as container images for the k3s
  # cluster. Flux's image automation in pscheid92/k8s (apps/website) puts the
  # newest tag of the form YYYYMMDD-HHMMSS-<sha> into production by itself,
  # so only main builds them: a run started by hand on another branch would
  # otherwise deploy that branch.
  images:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # the OIDC token that tells Flux about the new images
    steps:
      - uses: actions/checkout@v5
      - name: Tag
        id: tag
        run: echo "tag=$(date -u +%Y%m%d-%H%M%S)-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Site
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/pscheid92/website:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=website
          cache-to: type=gha,mode=max,scope=website
      - name: Speech tokens
        uses: docker/build-push-action@v7
        with:
          context: services/speech
          platforms: linux/amd64
          push: true
          tags: ghcr.io/pscheid92/website-speech:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      # Tells Flux on the cluster to look for the new images now rather than at
      # its next poll (pscheid92/k8s, apps/website/flux-receiver.yaml). Flux
      # accepts only an OIDC token issued to this repository's main. If the
      # call fails, Flux still finds the images within 5 minutes.
      - name: Tell Flux
        run: |
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=notification-controller" | jq -r .value)
          curl -sSf --max-time 20 -X POST -H "Authorization: Bearer $token" "$FLUX_RECEIVER" \
            || echo "::warning::Flux was not reached; it will find the images at its next poll"
        env:
          FLUX_RECEIVER: https://flux-webhook.k.patrickscheid.de/hook/ef37ff30e018a3a9587364878feed6394f080b22f82983aafff68511cf2e5e32
