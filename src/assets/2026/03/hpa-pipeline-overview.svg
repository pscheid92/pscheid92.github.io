<text x="506" y="70" text-anchor="middle" fill="#be123c" font-size="9" opacity="0.7" font-family="monospace">Pace</text>
<line x1="591" y1="45" x2="621" y2="45" stroke="#857e72" stroke-width="1.5"/>
