<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320"  aria-label="Formula ratio diagram">
<text x="30" y="30" fill="#3d3a34" font-size="12" font-weight="500" font-family="monospace">Metric Ratio</text>
<text x="30" y="62" fill="#5c574e" font-size="10" font-family="monospace">currentValue</text>
<rect x="140" y="48" width="280" height="28" rx="6" fill="#b45309" fill-opacity="0.2" stroke="#b45309" stroke-width="1"/>
<text x="280" y="67" text-anchor="middle" fill="#b45309" font-size="13" font-weight="600" font-family="monospace">70%</text>
<text x="30" y="108" fill="#5c574e" font-size="10" font-family="monospace">targetValue</text>
<rect x="140" y="94" width="200" height="28" rx="6" fill="none" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="6 3"/>
<text x="240" y="113" text-anchor="middle" fill="#1d4ed8" font-size="13" font-weight="600" font-family="monospace">50%</text>
<line x1="432" y1="62" x2="432" y2="108" stroke="#857e72" stroke-width="1" stroke-dasharray="3 2"/>
<text x="446" y="75" fill="#b45309" font-size="12" font-weight="500" font-family="monospace">70 / 50 = </text>
<text x="530" y="75" fill="#b45309" font-size="16" font-weight="700" font-family="monospace">1.4</text>
<text x="446" y="100" fill="#5c574e" font-size="11" font-family="monospace">40% over target → need 40% more pods</text>
<text x="446" y="128" fill="#b45309" font-size="11" font-weight="500" font-family="monospace">ceil(7 × 1.4) = 10 pods</text>
<text x="30" y="185" fill="#3d3a34" font-size="12" font-weight="500" font-family="monospace">±10% Tolerance Band</text>
<line x1="60" y1="220" x2="740" y2="220" stroke="#b3ab9d" stroke-width="1.5"/>
<line x1="100" y1="215" x2="100" y2="225" stroke="#857e72" stroke-width="1"/>
<text x="100" y="242" text-anchor="middle" fill="#5c574e" font-size="10" font-family="monospace">0.5</text>
<line x1="250" y1="215" x2="250" y2="225" stroke="#857e72" stroke-width="1"/>
<text x="250" y="242" text-anchor="middle" fill="#5c574e" font-size="10" font-family="monospace">0.75</text>
<line x1="340" y1="212" x2="340" y2="228" stroke="#b45309" stroke-width="1.5" opacity="0.6"/>
<text x="340" y="252" text-anchor="middle" fill="#b45309" font-size="10" opacity="0.8" font-family="monospace">0.9</text>
<line x1="400" y1="210" x2="400" y2="230" stroke="#161512" stroke-width="2"/>
<text x="400" y="252" text-anchor="middle" fill="#161512" font-size="11" font-weight="600" font-family="monospace">1.0</text>
<line x1="460" y1="212" x2="460" y2="228" stroke="#b45309" stroke-width="1.5" opacity="0.6"/>
<text x="460" y="252" text-anchor="middle" fill="#b45309" font-size="10" opacity="0.8" font-family="monospace">1.1</text>
<line x1="550" y1="215" x2="550" y2="225" stroke="#857e72" stroke-width="1"/>
<text x="550" y="242" text-anchor="middle" fill="#5c574e" font-size="10" font-family="monospace">1.25</text>
<line x1="700" y1="215" x2="700" y2="225" stroke="#857e72" stroke-width="1"/>
<text x="700" y="242" text-anchor="middle" fill="#5c574e" font-size="10" font-family="monospace">1.5</text>
<rect x="340" y="206" width="120" height="28" rx="4" fill="#b45309" fill-opacity="0.08"/>
<text x="400" y="198" text-anchor="middle" fill="#b45309" font-size="9" opacity="0.7" font-family="monospace">no action zone</text>
<circle cx="640" cy="220" r="6" fill="#b45309" fill-opacity="0.3" stroke="#b45309" stroke-width="2"/>
<line x1="640" y1="262" x2="640" y2="272" stroke="#b45309" stroke-width="1"/>
<text x="640" y="286" text-anchor="middle" fill="#b45309" font-size="10" font-weight="600" font-family="monospace">ratio = 1.4</text>
<text x="640" y="300" text-anchor="middle" fill="#b45309" font-size="9" opacity="0.7" font-family="monospace">outside tolerance → scale up</text>
</svg>
